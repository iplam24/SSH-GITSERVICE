<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#04070B" />
    </linearGradient>

    <!-- Emerald to Teal Glow Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle with cyber stroke -->
  <rect x="18" y="18" width="220" height="220" rx="52" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="4.5" />

  <!-- Inner ambient circular radar -->
  <circle cx="128" cy="128" r="82" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 6" />

  <!-- Terminal Prompt '>' on the left -->
  <path d="M 68 86 L 116 128 L 68 170" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Command Terminal Line '_' at bottom right -->
  <path d="M 124 170 L 188 170" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Lightning Energy Bolt '⚡' at top right -->
  <path d="M 148 76 L 176 76 L 158 106 L 190 106 L 138 154 L 150 118 L 126 118 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
</svg>
