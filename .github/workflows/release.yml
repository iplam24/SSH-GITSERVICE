name: Release DevDock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tên phiên bản Release (ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: src/DevDock.Frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('src/DevDock.Frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Frontend Dependencies
        working-directory: src/DevDock.Frontend
        run: npm ci

      - name: Run Build & Packaging Pipeline
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1

      - name: Create Portable Zip Archive
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag_name }}" }
          Compress-Archive -Path "dist\DevDock" -DestinationPath "dist\DevDock-$tag-Portable-win-x64.zip" -Force

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: DevDock ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }} — Developer Command Center
          files: |
            dist/setup-devdock.exe
            dist/DevDock-*-Portable-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
